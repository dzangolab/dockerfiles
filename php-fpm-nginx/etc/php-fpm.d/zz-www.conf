; Loaded after the base image's docker.conf, www.conf and zz-docker.conf,
; so these settings win (docker.conf sets `listen = 9000` on all interfaces).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pass the container's environment (including expanded secrets) to PHP
clear_env = no
